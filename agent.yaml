spec_version: "0.1.0"
name: git-leadqualifier
version: 1.0.0
description: "Autonomous B2B Lead Scoring, Ideal Customer Profile (ICP) Matcher & Disposable Email Filter Agent"
author: "masood-mashu"
license: "Apache-2.0"

model:
  preferred: "openai:gpt-4o"
  fallback:
    - "anthropic:claude-3-5-sonnet"
    - "openai:gpt-4o-mini"
  constraints:
    temperature: 0.1
    max_tokens: 4096

skills:
  - b2b-icp-qualification
  - territory-routing-protocol

tools:
  - disposable-email-detector
  - icd-score-calculator
  - round-robin-assigner
  - phone-format-validator

runtime:
  max_turns: 50
  timeout: 120

tags:
  - sales
  - marketing
  - lead-scoring
  - crm
  - passport-challenge

metadata:
  passport_id: "aps-leadqualifier-01"
  passport_category: "Marketing & sales"
